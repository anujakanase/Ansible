[servers]

worker-node-1 ansible_host=<public_ip_worker-node-1>
worker-node-2 ansible_host=<public_ip_worker-node-2>
worker-node-1 ansible_user=ubuntu
worker-node-2 ansible_user=ubuntu


[all:vars]
ansible_ssh_private_key_file=/home/ubuntu/.ssh/<private_key_id>
ansible_python_interpreter= /usr/bin/python3
ansible_host_key_checking=false
